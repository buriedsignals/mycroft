name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate recipes
        run: python3 tools/validate-recipes.py
      - name: Validate HTML parses
        run: |
          python3 -c "
          import html.parser
          class V(html.parser.HTMLParser):
              def error(self, m): raise Exception(m)
          for f in ['index.html']:
              V().feed(open(f).read())
              print(f + ': OK')
          "
      - name: Validate skills index
        run: python3 tests/skills-index-check.py
      - name: Validate journalist install CTAs
        run: bash tests/journalist-install-cta-check.sh
      - name: Validate installer pointer
        run: bash tests/install-sh-check.sh
      - name: Validate fresh-machine preflight
        run: bash tests/install-preflight-check.sh
      - name: Validate acquisition backend contracts
        run: |
          bash tests/doctor-backends-check.sh
          python3 tests/acquisition-routing-check.py
          python3 tests/install-contract-check.py
      - name: Install c2patool 0.27.22 (tests/grounding-provenance-check.py)
        run: |
          curl -fsSL -o /tmp/c2patool.tar.gz https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v0.27.22/c2patool-v0.27.22-x86_64-unknown-linux-gnu.tar.gz
          echo "6f138ad53da1a62f1cd6ee71c60727efa27d13b811f4c0ea8c2a8528968b358b  /tmp/c2patool.tar.gz" | sha256sum -c -
          mkdir -p /tmp/c2patool && tar -xzf /tmp/c2patool.tar.gz -C /tmp/c2patool
          sudo install -m 0755 "$(find /tmp/c2patool -type f -name c2patool | head -1)" /usr/local/bin/c2patool
          c2patool --version
      - name: Validate grounding/provenance tooling
        run: python3 tests/grounding-provenance-check.py
      - name: Validate fact-check recipe and lookup tools
        run: |
          python3 tests/fact-check-recipe-contract.py
          python3 tests/fact-check-tools-check.py
      - name: Validate JSON parses
        run: |
          python3 -c "
          import json, glob
          for f in glob.glob('providers/*.json') + glob.glob('extensions/*.json') + glob.glob('schemas/*.json'):
              json.load(open(f))
              print(f + ': OK')
          "

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v5
