name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests run validate only; deploy and its Pages write scopes stay on main.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate HTML parses
        run: |
          python3 -c "
          import html.parser
          class V(html.parser.HTMLParser):
              def error(self, m): raise Exception(m)
          for f in ['index.html']:
              V().feed(open(f).read())
              print(f + ': OK')
          "
      - name: Validate skills index
        run: python3 tests/skills-index-check.py
      - name: Validate journalist install CTAs
        run: bash tests/journalist-install-cta-check.sh
      - name: Validate installer pointer
        run: bash tests/install-sh-check.sh
      - name: Validate feedback widget
        run: node tests/feedback-widget-check.js
      - name: Validate JSON parses
        run: |
          python3 -c "
          import json, glob
          for f in glob.glob('catalog/*.json') + glob.glob('install/contracts/*.json'):
              json.load(open(f))
              print(f + ': OK')
          "

  deploy:
    needs: validate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v5
