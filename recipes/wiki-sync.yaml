version: "1.0.0"
title: "Knowledge sync"
description: "Journal findings from the current Goose session into the configured Knowledge Workspace with proper frontmatter and links."

instructions: |
  Load the Mycroft journalism instructions and knowledge-workspace skill.
  Use OpenKnowledge for writes. Never silently fall back to direct files.

parameters:
  - key: vault_path
    input_type: string
    requirement: required
    description: "OpenKnowledge project root"
  - key: project
    input_type: string
    requirement: optional
    description: "Investigation project slug (creates investigations/{project}/ tree). Leave empty for shared/."
    default: ""
  - key: findings
    input_type: string
    requirement: required
    description: "The findings to write — free-text or structured (entities, sources, events)"

extensions:
  - type: builtin
    name: developer
  - type: stdio
    name: openknowledge
    cmd: ok
    # --no-bundle-proxy: on macOS run the Engine-pinned OpenKnowledge server, not an installed OpenKnowledge.app of any version.
    args: ["--cwd", "{{ vault_path }}", "mcp", "--no-bundle-proxy"]
    # Goose advertises only the OpenKnowledge tools Mycroft uses (2026-09-14: 27 -> 15 tools, 27K -> 17K prompt tokens on this recipe).
    available_tools: ["search", "exec", "write", "edit", "links", "lint", "history", "move", "delete"]

prompt: |
  Sync these findings into the Mycroft OpenKnowledge project rooted at `{{ vault_path }}`:

  ```
  {{ findings }}
  ```

  Wiki service (`bsig wiki`) rules, for every call below:
  - Find the wiki root once, the way OpenKnowledge finds its project: the nearest folder at or above `{{ vault_path }}` that holds `.ok/config.yml` (`root="{{ vault_path }}"; while [ ! -f "$root/.ok/config.yml" ] && [ "$root" != / ]; do root=$(dirname "$root"); done`). If `$root/.ok/config.yml` does not exist, stop and say the wiki could not be found. Pass `--workspace "$root"` on every call, so the wiki service and OpenKnowledge read the same wiki.
  - Never put a query, name, path or claim on the command line. Send the tool's JSON arguments on stdin through a quoted heredoc, which the shell leaves unexpanded, and write them with JSON string escaping:

    ```sh
    bsig --json wiki resolve --workspace "$root" <<'WIKI_ARGS'
    {"name": "...", "type": "person"}
    WIKI_ARGS
    ```

  - The answer is `data.result` on the `"event":"result"` line; an `"event":"error"` line carries `data.failure`. `resolve` answers `status` `linked` (use its `entity_id`), `candidates` (similar names to judge, never a match) or `unknown`. Names of protected sources come back as `[protected]`; that is expected, never guess them.
  - If `bsig wiki` is not available (an older Engine reports an unknown verb), look the entity up through OpenKnowledge instead: `search` for its names, then read the candidates under `wiki/entities/` with `exec`. Treat one as the same entity only when an exact strong identifier matches (knowledge-primitives); otherwise write a new entity note, list the similar ones in the report, and link nothing automatically.

  **Step 1 — Structure the findings** into:
  - **Entities**: people, organizations, companies, places (one entity note each, following the Entities section of knowledge-primitives: look the entity up first with the wiki service's `resolve`, following the rules above, never merge)
  - **Sources**: documents, URLs, interviews (one note per source under `wiki/sources/`)
  - **Methodology**: techniques used, one note per technique under `wiki/methods/` (only if novel)
  - **Project notes**: if {{ project }} is set, per-project notes under `wiki/topics/{{ project }}/`

  **Step 2 — For each note**:

  Frontmatter template (types per knowledge-primitives):
  ```yaml
  ---
  type: note            # source for source notes; an entity's kind for entities
  kind: method | topic  # for type: note
  title: [canonical name]
  description: [one line]
  tags: [tag1, tag2]
  created: YYYY-MM-DD
  updated: YYYY-MM-DD
  project: [{{ project }} or "" if shared]
  confidence: [verified | partial | unverified]
  ---
  ```

  Body: concise. Wiki-links to register entities via `[[wiki/entities/<id>]]` (the id `resolve` returned), to other notes, and to entity notes written without `bsig wiki`, via their path. Evidence citations inline.

  **Step 3 — Write through OpenKnowledge**:

  Use `write` for new documents. Before a bounded `edit`, read the current document and target one exact occurrence. Read every result back and verify its content and links before reporting success.

  **Step 4 — Report back**:
  - List every file created / updated.
  - Flag any entities that couldn't be fully resolved (ambiguous names, no confirming source).

  **Rules**:
  - Do not write to `consulting/` or `journals/` vaults — those are off-limits unless explicitly targeted.
  - If OpenKnowledge fails, report exactly which documents were not written. Do not write elsewhere or claim that a durable outbox exists.
  - Never fabricate entity details. If a fact is missing, leave the field blank rather than guessing.

activities:
  - "Sync these findings to Mycroft knowledge"
  - "Write these entities and sources into investigations/{{ project }}/"
  - "Update a durable entity record"
