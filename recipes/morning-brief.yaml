version: "2.0.0"
title: "Morning brief"
description: "Run your configured morning brief through Engine, then open its saved Goose conversation and verified wiki note. Setup and controls stay in Mycroft in Goose."

instructions: |
  Use the installed Engine's typed morning-brief operations as the authority.
  Never acquire sources, write the brief, send mail, or create schedules yourself.
  Never ask for an API key in chat or pass credentials on the command line.
  Do not claim that a saved wiki note alone is chat or email delivery.

extensions:
  - type: builtin
    name: developer

prompt: |
  Run `bsig brief status --json` using the installed Engine.
  If no setup exists, or recurrence is paused or needs verification, explain the
  returned state and guide the journalist through morning-brief setup in Goose.
  Do not create an implicit schedule or invent sources or a beat from memory.

  If ready, run `bsig brief run-now --json`. Engine collects only the selected
  sources, validates the full brief and its citations, saves it through
  OpenKnowledge, and preserves the same result in a named Goose conversation.
  Optional email uses the approved recipient and AgentMail sending inbox.
  Engine owns source permissions, background scheduling, retries and delivery.

  Read the actual result. Present its saved conversation link and wiki location,
  actual reporting window, partial sources, and email status when applicable.
  Say provider accepted only when that is the recorded status; do not turn it
  into confirmed inbox delivery. On failure, give the reported recovery action.
  Use `bsig brief open-result --json` to retrieve the latest saved result when asked
  "Where is today's brief?". Do not add a Morning brief screen to Indicator Labs.

  Sources may include explicitly chosen public websites/RSS, selected wiki
  material, and individually approved newsletters. There is no automatic
  bookmark import, guessed monitoring profile, or unread-only inbox scan.
  Newsletters and private wiki text require explicit disclosure approval before
  entering an emailed brief, including when the model runs locally.

activities:
  - "Run today's configured morning brief"
  - "Where is today's brief?"
  - "Show morning brief status"
