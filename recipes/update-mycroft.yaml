version: "1.0.0"
title: "Update Mycroft"
description: "Safely update the Goose-installed Mycroft profile from the upstream repository."

instructions: |
  Journalists update Mycroft in Indicator Labs at https://buriedsignals.com/join.
  This recipe is only the desktop-safe path for a private Splash-enabled git checkout.
  Do not fetch a public-installer bundle or improvise shell commands.
  Run the deterministic updater wrapper, then summarize the result.

parameters: []

extensions:
  - type: builtin
    name: developer

prompt: |
  Update Mycroft only if this machine has a private Splash-enabled git checkout
  by running exactly:

  ~/.local/bin/mycroft-update --manual

  If the updater fails closed and points at Indicator Labs, tell the user to
  update Mycroft there (https://buriedsignals.com/join). Do not fetch a
  public-installer bundle or re-run install.sh.

  Then inspect the update log at:

  ~/.local/share/goose/mycroft/logs/update.log

  Report:

  - whether Mycroft updated
  - whether Spotlight updated
  - whether `mycroft doctor` passed
  - any rollback or conflict message

  Do not edit vault files. Do not print secrets. Do not run ad hoc git commands outside the updater wrapper.

activities:
  - "Update Mycroft"
  - "Check for Mycroft updates"
  - "Pull the latest Mycroft skills and recipes"
