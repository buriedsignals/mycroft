version: "1.0.0"
title: "Wiki audit"
description: "Scheduled audit of the Mycroft OpenKnowledge wiki for stale notes, missing frontmatter, orphaned sources, weak claims, and approved Spotlight material already handed to Mycroft."

instructions: |
  Load the Mycroft journalism instructions, knowledge-primitives skill, and knowledge-workspace skill.
  Audit the wiki. Do not rewrite the user's notes unless the task explicitly says to fix; by default, write a dated audit report.

parameters:
  - key: vault_path
    input_type: string
    requirement: required
    description: "Absolute path to the Mycroft OpenKnowledge workspace."
  - key: output_path
    input_type: string
    requirement: optional
    description: "Directory for audit reports."
    default: "~/Documents/OpenKnowledge/Mycroft/_audits"

extensions:
  - type: builtin
    name: developer
    description: "Shell + file access for reading the wiki and writing the audit report."
  - type: stdio
    name: openknowledge
    cmd: ok
    # --no-bundle-proxy: on macOS run the Engine-pinned OpenKnowledge server, not an installed OpenKnowledge.app of any version.
    args: ["--cwd", "{{ vault_path }}", "mcp", "--no-bundle-proxy"]
    # Goose advertises only the OpenKnowledge tools Mycroft uses (2026-09-14: 27 -> 15 tools, 27K -> 17K prompt tokens on this recipe).
    available_tools: ["search", "exec", "write", "edit", "links", "lint", "history", "move", "delete"]

prompt: |
  Run a Mycroft wiki audit.

  Wiki service reads go through Mycroft's wiki tool. Never build a command line from a value (the vault path, a query, a name, a claim):
  - Send one JSON object on stdin in a quoted heredoc, which the shell leaves unexpanded: `vault_path` exactly as given below, and the tool's arguments under `args`, written with JSON string escaping. If the vault path contains a line break, stop.

    ```sh
    python3 "$MYCROFT_DIR/tools/wiki-service.py" check <<'WIKI_ARGS'
    {"vault_path": "{{ vault_path }}", "args": {}}
    WIKI_ARGS
    ```

  - Verbs: `search` (`query`), `read` (`path`), `resolve` (`name`, `type`), `check` (no args), `ok-audit` (no args; OpenKnowledge's own audit).
  - The tool finds the wiki root, the OpenKnowledge project at or above the vault, and refuses a relative or missing path, `.`, and a root at `/` or the home folder. On a `wiki-root` error, stop and report it.
  - The answer is `data.result` on the `"event":"result"` line; an `"event":"error"` line carries `data.failure`. `resolve` answers `status` `linked` (use its `entity_id`), `candidates` (similar names to judge, never a match) or `unknown`. Names of protected sources come back as `[protected]`; that is expected, never guess them.
  - `wiki-service-unavailable` means an older Engine: use OpenKnowledge `lint` for frontmatter-schema problems and say so in the report.

  Validate in two passes through the developer shell, both read-only:

  - `check` runs the wiki service's validator over the whole wiki: every note's type against the wiki's schemas, and the entity register's references. Report each problem it returns with its path.
  - `ok-audit` (OpenKnowledge's `ok audit --json`) lists broken internal links (findings with `source: links`) and OpenKnowledge's own frontmatter findings. Exit code 1 only means it found problems. It needs the OpenKnowledge server running; if it says the server is not running, use `links` with `kind: "dead"` instead and say so in the report.

  Use OpenKnowledge `links` for orphan checks, `lint` for Markdown health, `search` for discovery, and `exec` for exact reads. Skip `.trash/` and binary files.

  Check:

  1. Missing or malformed frontmatter, including notes whose `type` the wiki's schemas reject (see knowledge-primitives).
  2. Source notes without URLs, paths, access dates, or confidence.
  3. Claim notes without citations or verdicts.
  4. Orphaned files not linked from `_index.md`, story notes, or wiki notes.
  5. Raw source files that have no processed extract.
  6. Spotlight handoffs under `handoff/from-spotlight/` that should become durable wiki notes or story pitches.
  7. Story pitches that have no evidence links.
  8. Sensitive notes that lack explicit `sensitive: true` frontmatter.

  Do not inspect Spotlight's workspace or active cases during the audit. Audit only material already present in Mycroft's `handoff/from-spotlight/` folder.

  Write a dated markdown report to `{{ output_path }}/wiki-audit-YYYY-MM-DD.md` with:

  ```markdown
  # Wiki Audit — YYYY-MM-DD

  ## Summary

  ## Needs Attention

  ## Missing Frontmatter

  ## Weak Claims

  ## Orphaned Sources

  ## Spotlight Handoffs

  ## Suggested Next Actions
  ```

  Keep findings specific: include paths and short reasons.

activities:
  - "Run today's wiki audit"
  - "Find weak claims and orphaned sources"
  - "Review Spotlight handoffs"
