version: "1.0.0"
title: "Start Mycroft"
description: "Interactive first-run entry point. Helps a journalist choose what to do first with an empty or newly installed Mycroft wiki."

instructions: |
  Load the Mycroft journalism instructions.
  This is the default first-run recipe for a new Mycroft install. The user may not know which workflow to ask for yet.
  Do not assume there is existing reporting material in the wiki. Offer concrete starting actions and help the user choose one.

parameters:
  - key: vault_path
    input_type: string
    requirement: required
    description: "Mycroft OpenKnowledge workspace path."
    default: "~/Documents/OpenKnowledge/Mycroft"

extensions:
  - type: builtin
    name: developer
    description: "Shell + file access for reading the wiki scaffold and writing starter notes."

prompt: |
  Start the user's Mycroft setup.

  First, briefly explain that Mycroft is ready but needs reporting context or source material before it can become useful.

  Offer these choices exactly, with one-line descriptions:

  1. Set up my beat — define beats, geography, institutions, people, sources, ignored noise, and story triggers.
  2. Add to my knowledge base — ingest URLs, PDFs, newsletters, pasted notes, documents, or folders into structured source, entity, timeline, and story notes.
  3. Help me set up my morning brief — choose sources, a local start time and Goose or email delivery, then verify a first result.
  4. Investigate a lead — start from a name, company, place, document, claim, or allegation and create a structured investigation path.
  5. Set up scouts — monitor pages, feeds, accounts, agendas, or topics for changes and recurring leads.
  6. Show me a demo — create a small fake reporting workflow so the user can see how Mycroft organizes knowledge.

  Do not offer "audit my notes" as a default action for a new install. Mention cleanup/import only if the user says they already have an existing wiki or lots of notes.

  After the user chooses:

  - For "Set up my beat", ask for beat, geography, must-watch entities, priority sources, ignored topics, and source-handling rules. Write or update `{{ vault_path }}/context/beat-notes.md`.
  - For "Add to my knowledge base", ask for links, files, pasted notes, or a folder path. Preserve raw material under `sources/raw/` when possible, create durable notes under `wiki/`, append `_log.md`, and update `_index.md`.
  - For "Help me set up my morning brief" (or "Create my morning brief"), follow `recipes/morning-brief-preflight.yaml`. Keep setup in this Goose conversation; Engine owns the saved configuration and verification. Do not write a loose monitoring profile or create a Goose schedule.
  - For "Investigate a lead", ask for the lead, jurisdiction, sensitivity level, known sources, and what the user wants to prove or disprove. If Spotlight is installed and the lead needs active OSINT casework, follow `recipes/spotlight-case.yaml` with action `launch`: hand the lead to Spotlight and let Spotlight run its own brief gate. Never draft a second Mycroft brief approval, never create a case directory directly, and never put active case material in OpenKnowledge. Otherwise create a Mycroft story pitch and source plan.
  - For "Set up scouts", ask what should be monitored, how often it matters, and what changes should trigger attention. Use Scoutpost if installed; otherwise create a scout plan in `{{ vault_path }}/context/scouts.md`.
  - For "Show me a demo", create a clearly marked fake demo under `{{ vault_path }}/stories/pitches/demo-story-pitch.md`, `{{ vault_path }}/wiki/entities/demo-acme-corp.md`, and `{{ vault_path }}/wiki/sources/demo-source.md`. Keep every demo note tagged `demo` and `example`.

  Keep the first interaction short. Ask at most one concise group of questions at a time.

activities:
  - "Start using Mycroft"
  - "Add material to my knowledge base"
  - "Set up my beat"
  - "Help me set up my morning brief"
  - "Investigate a lead"
